l_english:
  ir_aristocratic_monarchy: "Aristocratic Monarchy"
  ir_aristocratic_monarchy_desc: "A kingship anchored in landed elites, household retainers, and aristocratic councils."
  ir_despotic_monarchy: "Despotic Monarchy"
  ir_despotic_monarchy_desc: "Royal authority is concentrated in the palace, provincial power is curtailed, and taxation is centralized."
  ir_stratocratic_monarchy: "Stratocratic Monarchy"
  ir_stratocratic_monarchy_desc: "Military leadership and royal command structure define the state."
  ir_spartan_monarchy: "Spartan-Style Monarchy"
  ir_spartan_monarchy_desc: "A disciplined warrior monarchy built around elite military service and austere institutions."
  ir_plutocratic_monarchy: "Plutocratic Monarchy"
  ir_plutocratic_monarchy_desc: "The crown governs through wealthy mercantile interests and fiscal partnerships."
  ir_satrapal_administration: "Satrapal Administration"
  ir_satrapal_administration_desc: "A layered monarchy where provincial governors and client rulers are integrated into royal rule."
  ir_royal_companion_corps: "Royal Companion Corps"
  ir_royal_companion_corps_desc: "Royal authority is reinforced by elite companions and household military cadres."

  ir_aristocratic_republic: "Aristocratic Republic"
  ir_aristocratic_republic_desc: "Republican offices are dominated by hereditary elites and senatorial factions."
  ir_plutocratic_republic: "Plutocratic Republic"
  ir_plutocratic_republic_desc: "Urban wealth and commercial interests shape elections, policy, and administration."
  ir_punic_republic: "Punic Maritime Republic"
  ir_punic_republic_desc: "A seaborne republic combining mercantile oligarchy with naval strategy and colonial trade."
  ir_oligarchic_republic: "Oligarchic Republic"
  ir_oligarchic_republic_desc: "A narrow ruling class keeps political offices in the hands of established families."
  ir_democratic_republic: "Democratic Republic"
  ir_democratic_republic_desc: "Broader civic participation balances elite influence and strengthens republican legitimacy."
  ir_city_state_republic: "City-State Republic"
  ir_city_state_republic_desc: "Compact republican institutions prioritize urban prosperity, diplomacy, and civic cohesion."
  ir_maritime_league_republic: "Maritime League Republic"
  ir_maritime_league_republic_desc: "Trade-oriented poleis coordinate fleets and commerce through league institutions."

  ir_theocratic_republic: "Theocratic Republic"
  ir_theocratic_republic_desc: "Sacral authority legitimizes republican rule through priestly supervision and public cult."
  ir_theocratic_monarchy: "Theocratic Monarchy"
  ir_theocratic_monarchy_desc: "Dynastic kingship is fused with temple authority and religious orthodoxy."
  ir_sacred_college_theocracy: "Sacred College Governance"
  ir_sacred_college_theocracy_desc: "High priests and learned cult officials guide policy through organized sacred institutions."

  ir_tribal_kingdom: "Tribal Kingdom"
  ir_tribal_kingdom_desc: "A dynastic realm rooted in clan structures, food security, and customary obligations."
  ir_tribal_federation: "Tribal Federation"
  ir_tribal_federation_desc: "Multiple tribes coordinate through negotiated leadership and confederate diplomacy."
  ir_tribal_chiefdom: "Tribal Chiefdom"
  ir_tribal_chiefdom_desc: "A dominant chief rules through kinship authority, redistribution, and local autonomy."
  ir_confederated_tribal_council: "Confederated Tribal Council"
  ir_confederated_tribal_council_desc: "A council of leading clans manages common policy while preserving tribal self-rule."
